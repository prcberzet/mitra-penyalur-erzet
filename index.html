<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menara Kemitraan — Monitoring Mitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141B2E;
    --navy-2:#1F2A44;
    --navy-3:#2B3A5E;
    --bg:#F2F4F7;
    --surface:#FFFFFF;
    --ink:#171B26;
    --ink-soft:#626B7E;
    --ink-faint:#95A0B4;
    --line:#E2E5EC;
    --brand:#3A6B5C;
    --brand-soft:#E7F0EC;
    --ok:#2E8B57;
    --ok-soft:#E6F4EC;
    --warn:#C7862B;
    --warn-soft:#FBF0E1;
    --crit:#C0473F;
    --crit-soft:#FBEAE9;
    --radius:10px;
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#C7CDD9; border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:300px;
    min-width:300px;
    background:var(--navy);
    color:#EDEFF4;
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
    transition:opacity .15s;
  }
  .brand:hover{opacity:.85;}
  .brand-mark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    letter-spacing:0.2px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand-mark .dot{
    width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg,#5FBF9A,var(--brand));
    box-shadow:0 0 0 3px rgba(95,191,154,0.18);
  }
  .brand-sub{
    font-size:11.5px;
    color:#8D96AC;
    margin-top:4px;
    letter-spacing:0.3px;
  }
  .sidebar-tools{
    padding:14px 16px 8px;
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;
    padding:8px 10px;
  }
  .search-box input{
    background:transparent; border:none; outline:none;
    color:#EDEFF4; font-size:13px; width:100%;
  }
  .search-box input::placeholder{color:#7B8399;}
  .btn-add-mitra{
    margin-top:10px;
    width:100%;
    background:var(--brand);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:9px 12px;
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:background .15s;
  }
  .btn-add-mitra:hover{background:#2F5A4D;}

  #mitraList{
    flex:1;
    overflow-y:auto;
    padding:6px 10px 14px;
  }
  .mitra-card{
    padding:12px 12px;
    border-radius:9px;
    margin-bottom:6px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .12s;
  }
  .mitra-card:hover{background:rgba(255,255,255,0.05);}
  .mitra-card.active{
    background:var(--navy-2);
    border-color:rgba(255,255,255,0.1);
  }
  .mitra-card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  }
  .mitra-card-top-left{display:flex; gap:9px; align-items:flex-start; min-width:0;}
  .mitra-logo-sm{
    width:28px; height:28px; border-radius:7px; object-fit:cover;
    border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); flex-shrink:0;
  }
  .mitra-name{
    font-size:13.5px; font-weight:600; line-height:1.3;
    color:#F2F4F8;
  }
  .mitra-pic{
    font-size:11px; color:#8D96AC; margin-top:2px;
  }
  .status-pill{
    font-size:10px; font-weight:600; padding:2px 8px; border-radius:20px;
    white-space:nowrap; letter-spacing:.2px;
  }
  .pill-ok{background:var(--ok-soft); color:var(--ok);}
  .pill-warn{background:var(--warn-soft); color:var(--warn);}
  .pill-crit{background:var(--crit-soft); color:var(--crit);}

  .stage-rail-mini{
    display:flex; gap:4px; margin-top:9px;
  }
  .stage-rail-mini span{
    height:4px; flex:1; border-radius:3px; background:rgba(255,255,255,0.12);
  }
  .stage-rail-mini span.on{background:var(--brand);}
  .stage-rail-mini span.on.warn{background:var(--warn);}
  .stage-rail-mini span.on.crit{background:var(--crit);}

  .sidebar-foot{
    padding:12px 20px 16px;
    border-top:1px solid rgba(255,255,255,0.08);
    font-size:11px;
    color:#6E7690;
    display:flex; justify-content:space-between; align-items:center;
  }
  .conn-status{display:flex; align-items:center; gap:6px;}
  .conn-dot{width:7px;height:7px;border-radius:50%; background:#6E7690; flex-shrink:0;}
  .conn-dot.live{background:#5FBF9A;}
  .conn-dot.demo{background:#C7862B;}

  /* ---------- Main ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  #topbar{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:18px 32px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
  }
  #topbar h1{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:600;
  }
  #topbar .meta{
    font-size:12.5px; color:var(--ink-soft); margin-top:4px;
    display:flex; gap:14px; flex-wrap:wrap;
  }
  #topbar .meta span{display:flex; align-items:center; gap:5px;}
  .topbar-main{display:flex; gap:14px; align-items:flex-start;}
  .mitra-logo{
    width:52px; height:52px; border-radius:10px; object-fit:cover;
    border:1px solid var(--line); background:var(--bg); flex-shrink:0;
  }
  .ringkasan-text{
    font-size:12.5px; color:var(--ink-soft); margin-top:9px;
    max-width:640px; line-height:1.55;
  }
  .topbar-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .btn{
    border:1px solid var(--line);
    background:var(--surface);
    padding:8px 14px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    transition:all .12s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--brand); color:var(--brand);}
  .btn-primary{background:var(--brand); color:#fff; border-color:var(--brand);}
  .btn-primary:hover{background:#2F5A4D; color:#fff;}
  .btn-danger-ghost{color:var(--crit); border-color:var(--crit-soft);}
  .btn-danger-ghost:hover{background:var(--crit-soft); border-color:var(--crit);}
  .btn-sm{padding:5px 10px; font-size:11.5px;}

  .status-dot{
    width:7px; height:7px; border-radius:50%;
    display:inline-block; margin-left:7px; position:relative; top:-1px;
    background:var(--ink-faint);
  }
  .status-dot.ok{background:var(--ok);}
  .status-dot.warn{background:var(--warn);}
  .status-dot.crit{background:var(--crit);}

  /* Sub program tabs */
  #programTabs{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:10px 32px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .program-tab{
    display:flex; align-items:center; gap:7px;
    background:var(--bg); border:1px solid var(--line); border-radius:20px;
    padding:6px 10px 6px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .program-tab.active{background:var(--brand-soft); border-color:var(--brand); color:var(--brand);}
  .program-tab-del{
    font-size:10px; color:var(--ink-faint); border-radius:50%; width:16px; height:16px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .program-tab-del:hover{background:var(--crit-soft); color:var(--crit);}
  .program-tab-add{
    border:1px dashed var(--line); background:transparent; border-radius:20px;
    padding:6px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .program-tab-add:hover{border-color:var(--brand); color:var(--brand);}

  /* Stage rail (main) */
  #stageRail{
    display:flex;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:0 32px;
  }
  .stage-node{
    flex:1;
    padding:14px 6px 12px;
    text-align:center;
    border-bottom:3px solid transparent;
    cursor:pointer;
    position:relative;
    color:var(--ink-soft);
  }
  .stage-node.active{color:var(--ink); border-bottom-color:var(--brand);}
  .stage-node .num{
    font-family:var(--font-mono);
    font-size:11px;
    display:block;
    color:var(--ink-faint);
    margin-bottom:3px;
  }
  .stage-node .label{font-size:13px; font-weight:600;}
  .stage-node .dot{
    width:7px; height:7px; border-radius:50%;
    display:inline-block; margin-left:6px;
    background:var(--ink-faint);
    position:relative; top:-1px;
  }
  .stage-node .dot.ok{background:var(--ok);}
  .stage-node .dot.warn{background:var(--warn);}
  .stage-node .dot.crit{background:var(--crit);}

  #content{
    flex:1;
    overflow-y:auto;
    padding:26px 32px 60px;
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:20px;
  }
  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px;
  }
  .panel-head h3{
    font-family:var(--font-display);
    font-size:15px; font-weight:600;
  }
  .panel-head p{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase;
    letter-spacing:.4px; color:var(--ink-soft); font-weight:600;
    padding:8px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:10px 10px; border-bottom:1px solid var(--line);
    color:var(--ink);
  }
  tbody tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .num-plain{font-family:var(--font-body); font-variant-numeric:tabular-nums;}
  .num-cell{text-align:right;}

  .chip{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
    display:inline-flex; align-items:center; gap:5px;
  }
  .chip-ok{background:var(--ok-soft); color:var(--ok);}
  .chip-warn{background:var(--warn-soft); color:var(--warn);}
  .chip-crit{background:var(--crit-soft); color:var(--crit);}
  .chip::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}

  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{
    border:none; background:transparent; color:var(--ink-faint);
    padding:4px 6px; border-radius:6px; font-size:12px;
  }
  .icon-btn:hover{background:var(--bg); color:var(--ink);}

  .empty-state{
    text-align:center; padding:34px 20px; color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:26px; margin-bottom:8px; display:block;}

  .link-cell a{color:var(--brand); font-size:12.5px; text-decoration:none;}
  .link-cell a:hover{text-decoration:underline;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .label{font-size:11.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.3px;}
  .stat-card .value{font-family:var(--font-mono); font-size:24px; font-weight:600; margin-top:6px;}
  .stat-card .value.plain{font-family:var(--font-body);}
  .stat-card .sub{font-size:11.5px; color:var(--ink-faint); margin-top:3px;}

  .legalitas-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .legalitas-item:last-child{border-bottom:none;}
  .legalitas-left{display:flex; flex-direction:column; gap:3px;}
  .legalitas-left .name{font-size:13.5px; font-weight:600;}
  .legalitas-left .date{font-size:11.5px; color:var(--ink-faint);}
  select.status-select{
    border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12px;
    font-family:inherit; background:var(--surface); color:var(--ink);
  }

  /* Overview grid of all mitra */
  .overview-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .overview-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; cursor:pointer; transition:border-color .12s, transform .12s;
  }
  .overview-card:hover{border-color:var(--brand); transform:translateY(-1px);}
  .overview-card-top{display:flex; gap:10px; align-items:flex-start; margin-bottom:10px;}
  .overview-logo{
    width:38px; height:38px; border-radius:8px; object-fit:cover;
    border:1px solid var(--line); background:var(--bg); flex-shrink:0;
  }
  .overview-card h4{font-size:14px; font-weight:600; margin-bottom:2px;}
  .overview-card .pic{font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
  .overview-card .ringkasan-snip{
    font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,27,46,0.45);
    display:none; align-items:center; justify-content:center; z-index:50;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface); border-radius:12px; width:100%; max-width:460px;
    max-height:88vh; overflow-y:auto; padding:24px;
  }
  .modal h3{font-family:var(--font-display); font-size:16px; margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px;
    font-size:13px; font-family:inherit; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:64px;}

  /* ---------- Login ---------- */
  #loginOverlay{
    position:fixed; inset:0; z-index:200;
    background:var(--navy);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .login-box{
    width:100%; max-width:340px;
    background:var(--surface);
    border-radius:var(--radius);
    padding:28px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .login-box .brand-mark{color:var(--ink); margin-bottom:14px;}
  .login-box h2{font-family:var(--font-display); font-size:18px; margin-bottom:4px;}
  .login-box .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:20px; line-height:1.5;}
  .login-error{font-size:12px; color:var(--crit); margin:-6px 0 12px; min-height:14px;}
  .login-box .btn-primary{width:100%; padding:10px; font-size:13px; margin-top:4px;}
  .logout-link{background:transparent; border:none; color:#8D96AC; font-size:11px; text-decoration:underline; padding:0;}
  .logout-link:hover{color:#EDEFF4;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  .tag-note{
    font-size:11.5px; color:var(--ink-faint); background:var(--bg);
    border-radius:7px; padding:8px 10px; margin-top:12px; line-height:1.5;
  }

  @media (max-width:900px){
    #sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s;}
    #sidebar.open{transform:translateX(0);}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <div class="brand-mark"><span class="dot"></span>Menara Kemitraan</div>
    <h2>Masuk ke Dashboard</h2>
    <div class="sub">Silahkan login menggunakan email dan password</div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Masuk</button>
    </form>
  </div>
</div>

<aside id="sidebar">
  <div class="brand" onclick="renderOverview()" title="Kembali ke Ringkasan Semua Mitra">
    <div class="brand-mark"><span class="dot"></span>Menara Kemitraan</div>
    <div class="brand-sub">Monitoring Mitra Program</div>
  </div>
  <div class="sidebar-tools">
    <div class="search-box">
      <span>🔎</span>
      <input id="searchInput" placeholder="Cari mitra..." oninput="renderSidebar()">
    </div>
    <button class="btn-add-mitra" onclick="openMitraModal()">+ Tambah Mitra</button>
  </div>
  <div id="mitraList"></div>
  <div class="sidebar-foot">
    <span id="mitraCountFoot">0 mitra</span>
    <span style="display:flex; align-items:center; gap:10px;">
      <span class="conn-status" id="connStatus"><span class="conn-dot" id="connDot"></span><span id="connLabel">Memuat...</span></span>
      <button id="logoutBtn" class="logout-link" type="button" title="Keluar dari akun">Keluar</button>
    </span>
  </div>
</aside>

<main id="main">
  <div id="topbar"></div>
  <div id="programTabs"></div>
  <div id="stageRail"></div>
  <div id="content"></div>
</main>

<!-- Generic Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<!-- =========================================================================
     FIREBASE BOOTSTRAP (realtime, lintas perangkat)
     Isi firebaseConfig di bawah dengan konfigurasi project Firebase Anda
     sendiri (Firebase Console → Project Settings → Web App). Selama nilai
     apiKey masih diawali "GANTI_", aplikasi otomatis berjalan dalam
     "Mode Demo (lokal)" — tetap bisa dicoba penuh, hanya saja data tidak
     tersimpan permanen / tidak sinkron ke perangkat lain.
     ========================================================================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
  apiKey: "AIzaSyCnHZtaxAcIIOTfVryFLvV0FTXqXBEtZNU",
  authDomain: "mitra-penyalur-erzet.firebaseapp.com",
  projectId: "mitra-penyalur-erzet",
  storageBucket: "mitra-penyalur-erzet.firebasestorage.app",
  messagingSenderId: "1013322990882",
  appId: "1:1013322990882:web:7d95443f6459c0a464517b"
};

  const isConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('GANTI_');

  if(isConfigured){
    try{
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      window.__fb = { db, auth, collection, doc, setDoc, deleteDoc, onSnapshot };
    }catch(e){
      console.error('Gagal inisialisasi Firebase:', e);
      window.__fb = null;
    }
  } else {
    window.__fb = null;
  }
  window.dispatchEvent(new Event('fb-ready'));

  /* ------- Login form wiring (perlu scope module utk signInWithEmailAndPassword) ------- */
  function pesanErrorLogin(code){
    if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(code)) return 'Email atau password salah.';
    if(code==='auth/invalid-email') return 'Format email tidak valid.';
    if(code==='auth/too-many-requests') return 'Terlalu banyak percobaan gagal, coba lagi beberapa saat.';
    if(code==='auth/network-request-failed') return 'Gagal terhubung ke server, cek koneksi internet.';
    return 'Gagal login. Coba lagi.';
  }

  (function wireLogin(){
    const fb = window.__fb;
    if(!fb || !fb.auth) return; // mode demo (belum dikonfigurasi): tidak butuh login

    const auth = fb.auth;
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

/* ------------------------------- STATE ---------------------------------- */
let selectedMitraId = null;      // null = halaman Ringkasan Semua Mitra (tampilan awal)
let activeSubProgramId = null;
let activeStage = 'dana';
let db = null;                   // diisi setelah bootstrap Firebase selesai dicek

const ALL_STAGES = [
  {key:'pra', label:'Pra'},
  {key:'dana', label:'Dana'},
  {key:'aktivitas', label:'Aktivitas'},
  {key:'laporan', label:'Laporan'},
  {key:'evaluasi', label:'Evaluasi'},
];
const TABS = ALL_STAGES.filter(s=>s.key!=='pra');

const fmtRp = n => 'Rp ' + (n||0).toLocaleString('id-ID');
const fmtDate = d => d ? new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '—';

/* ---------------------------- REALTIME SYNC ----------------------------- */
function normalizeMitra(m){
  m.legalitas = m.legalitas || [];
  m.subProgram = (m.subProgram && m.subProgram.length) ? m.subProgram : [defaultSubProgram()];
  m.subProgram.forEach(sp=>{
    sp.dana = sp.dana || [];
    sp.aktivitasHarian = sp.aktivitasHarian || [];
    sp.aktivitasMingguan = sp.aktivitasMingguan || [];
    sp.laporanBulanan = sp.laporanBulanan || [];
    sp.evaluasi = sp.evaluasi || {raport:[],jadwal:[],catatan:[]};
  });
  return m;
}
function ensureSelectionValid(){
  if(selectedMitraId && !mitraList.find(m=>m.id===selectedMitraId)) selectedMitraId = null;
  const m = currentMitra();
  if(m && (!activeSubProgramId || !m.subProgram.find(p=>p.id===activeSubProgramId))){
    activeSubProgramId = m.subProgram.length ? m.subProgram[0].id : null;
  }
}
async function persistMitra(m){
  if(!db) return; // Mode demo lokal: perubahan cukup disimpan di memori browser
  const fb = window.__fb;
  const { id, ...data } = m;
  try{ await fb.setDoc(fb.doc(db,'mitra',id), data); }
  catch(e){ console.error('Gagal menyimpan ke Firebase:', e); }
}
async function removeMitraRemote(id){
  if(!db) return;
  const fb = window.__fb;
  try{ await fb.deleteDoc(fb.doc(db,'mitra',id)); }
  catch(e){ console.error('Gagal menghapus di Firebase:', e); }
}
function newMitraId(){
  if(db){ const fb = window.__fb; return fb.doc(fb.collection(db,'mitra')).id; }
  return 'm'+Date.now();
}

let unsubscribeMitra = null;

window.addEventListener('fb-ready', () => {
  const fb = window.__fb;
  const connDot = document.getElementById('connDot');
  const connLabel = document.getElementById('connLabel');
  const loginOverlay = document.getElementById('loginOverlay');

  if(!fb || !fb.db || !fb.auth){
    // Belum dikonfigurasi (apiKey masih GANTI_...): jalan mode demo lokal, tanpa login
    loginOverlay.style.display = 'none';
    connDot.classList.add('demo');
    connLabel.textContent = 'Mode demo (lokal)';
    return;
  }

  db = fb.db;

  window.addEventListener('auth-changed', () => {
    const user = window.__fbUser;
    if(user){
      loginOverlay.style.display = 'none';
      if(unsubscribeMitra) unsubscribeMitra();
      unsubscribeMitra = fb.onSnapshot(fb.collection(db,'mitra'), snapshot => {
        mitraList = snapshot.docs.map(d => normalizeMitra({ id:d.id, ...d.data() }));
        ensureSelectionValid();
        connDot.classList.remove('demo'); connDot.classList.add('live');
        connLabel.textContent = 'Realtime aktif';

      }, err => {

        connDot.classList.remove('live'); connDot.classList.add('demo');
        connLabel.textContent = 'Koneksi gagal (mode lokal)';
      });

/* ---------------------------- STATUS ENGINE ---------------------------- */
function statusPra(m){
  const total = m.legalitas.length || 1;
  const ada = m.legalitas.filter(d=>d.status==='ada').length;
  const proses = m.legalitas.filter(d=>d.status==='proses').length;
  if(ada===total) return 'ok';
  if(ada+proses>=total || ada>0) return 'warn';
  return 'crit';
}
function statusDana(sp){
  if(!sp.dana.length) return 'crit';
  const last = sp.dana[sp.dana.length-1];
  if(last.pencairan===0) return 'crit';
  const rasio = last.pencairan? last.realisasi/last.pencairan : 0;
  if(rasio>=0.7) return 'ok';
  if(rasio>=0.3) return 'warn';
  return 'crit';
}
function statusAktivitas(sp){
  const hasHarian = sp.aktivitasHarian.length>0;
  const mingguOk = sp.aktivitasMingguan.length>0 && sp.aktivitasMingguan[0].status==='ada';
  if(hasHarian && mingguOk) return 'ok';
  if(hasHarian || mingguOk) return 'warn';
  return 'crit';
}
function statusLaporan(sp){
  if(!sp.laporanBulanan.length) return 'crit';
  const last = sp.laporanBulanan[sp.laporanBulanan.length-1];
  const items = [last.penerima,last.keuangan,last.dokumentasi,last.tertulis];
  const done = items.filter(Boolean).length;
  if(done===4) return 'ok';
  if(done>=2) return 'warn';
  return 'crit';
}
function statusEvaluasi(sp){
  if(sp.evaluasi.raport.length>0) return 'ok';
  if(sp.evaluasi.jadwal.length>0) return 'warn';
  return 'crit';
}
function stageStatusForSubProgram(sp,key){
  if(key==='dana') return statusDana(sp);
  if(key==='aktivitas') return statusAktivitas(sp);
  if(key==='laporan') return statusLaporan(sp);
  if(key==='evaluasi') return statusEvaluasi(sp);
}
/* Status per tahap untuk 1 mitra = kondisi terburuk di antara seluruh sub program */
function stageStatusForMitra(m,key){
  if(key==='pra') return statusPra(m);
  if(!m.subProgram.length) return 'crit';
  const hasil = m.subProgram.map(sp=>stageStatusForSubProgram(sp,key));
  if(hasil.includes('crit')) return 'crit';
  if(hasil.includes('warn')) return 'warn';
  return 'ok';
}
function overallStatus(m){
  const all = ALL_STAGES.map(s=>stageStatusForMitra(m,s.key));
  if(all.includes('crit')) return 'crit';
  if(all.includes('warn')) return 'warn';
  return 'ok';
}
const statusLabel = {ok:'Aman', warn:'Perlu Perhatian', crit:'Kritis'};
const statusPillClass = {ok:'pill-ok', warn:'pill-warn', crit:'pill-crit'};
const statusChipClass = {ok:'chip-ok', warn:'chip-warn', crit:'chip-crit'};

/* Thumbnail logo mitra: pakai link yang diisi staf, kalau kosong/gagal dimuat
   otomatis diganti placeholder berisi inisial nama mitra. */
function logoFallback(nama){
  const initials = encodeURIComponent((nama||'M').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase());
  return `https://ui-avatars.com/api/?name=${initials}&background=3A6B5C&color=fff&bold=true&size=128`;
}
function logoImg(m,cls){
  const fallback = logoFallback(m.nama);
  const src = (m.logo && m.logo.trim()) ? m.logo.trim() : fallback;
  return `<img class="${cls}" src="${src}" alt="Logo ${m.nama}" onerror="this.onerror=null;this.src='${fallback}'">`;
}
function escAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }
function escHtml(s){ return String(s==null?'':s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ------------------------------ SIDEBAR -------------------------------- */
function renderSidebar(){
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  const wrap = document.getElementById('mitraList');

  wrap.innerHTML = filtered.map(m=>{
    const os = overallStatus(m);
    const rail = ALL_STAGES.map(s=>{
      const st = stageStatusForMitra(m,s.key);
      return `<span class="on ${st==='ok'?'':st}"></span>`;
    }).join('');
    return `
      <div class="mitra-card ${m.id===selectedMitraId?'active':''}" onclick="selectMitra('${m.id}')">

              <div class="mitra-pic">PIC: ${m.pic}</div>
            </div>

          <span class="status-pill ${statusPillClass[os]}">${statusLabel[os]}</span>
        </div>
        <div class="stage-rail-mini">${rail}</div>
      </div>`;
  }).join('') || `<div class="empty-state"><span class="glyph">🗂️</span>Belum ada mitra yang cocok.</div>`;
  document.getElementById('mitraCountFoot').textContent = mitraList.length + ' mitra';
}

function selectMitra(id){
  selectedMitraId = id;
  const m = currentMitra();
  activeSubProgramId = (m && m.subProgram.length) ? m.subProgram[0].id : null;
  activeStage = 'dana';
  renderAll();
}
function renderOverview(){
  selectedMitraId = null;
  renderAll();
}

/* ------------------------------ TOPBAR --------------------------------- */
function currentMitra(){ return mitraList.find(m=>m.id===selectedMitraId); }
function currentSubProgram(){
  const m = currentMitra();
  if(!m || !m.subProgram.length) return null;
  return m.subProgram.find(p=>p.id===activeSubProgramId) || m.subProgram[0];

    top.innerHTML = `

/* -------------------------- SUB PROGRAM TABS ---------------------------- */
function renderProgramTabs(){
  const wrap = document.getElementById('programTabs');
  const m = currentMitra();
  if(!m){ wrap.innerHTML=''; return; }
  const sp = currentSubProgram();
  wrap.innerHTML = `
    ${m.subProgram.map(p=>`
      <div class="program-tab ${sp && p.id===sp.id?'active':''}" onclick="setSubProgram('${p.id}')">
        <span>${p.nama}</span>
        ${m.subProgram.length>1?`<span class="program-tab-del" onclick="event.stopPropagation(); hapusSubProgram('${m.id}','${p.id}')" title="Hapus sub program">✕</span>`:''}
      </div>`).join('')}
    <button class="program-tab-add" onclick="openSubProgramModal('${m.id}')">+ Sub Program</button>`;
}
function setSubProgram(id){
  activeSubProgramId = id;
  renderProgramTabs(); renderStageRail(); renderContent();
}
function openSubProgramModal(mid){
  openModal(`
    <h3>Tambah Sub Program</h3>
    <div class="field"><label>Nama Sub Program</label><input id="f_spnama" placeholder="Contoh: Pelatihan Guru SD"></div>
    <div class="field"><label>Deskripsi (opsional)</label><textarea id="f_spdesk" placeholder="Deskripsi singkat sub program"></textarea></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="simpanSubProgram('${mid}')">Simpan</button></div>
  `);
}
function simpanSubProgram(mid){
  const m = mitraList.find(x=>x.id===mid);
  const nama = document.getElementById('f_spnama').value.trim();
  if(!nama) return;
  const sp = defaultSubProgram(nama);
  sp.deskripsi = document.getElementById('f_spdesk').value||'';
  m.subProgram.push(sp);
  activeSubProgramId = sp.id;
  activeStage = 'dana';
  persistMitra(m);
  closeModal(); renderAll();
}
function hapusSubProgram(mid,spId){
  const m = mitraList.find(x=>x.id===mid);
  if(m.subProgram.length<=1){ alert('Mitra harus memiliki minimal 1 sub program.'); return; }
  if(!confirm('Hapus sub program ini beserta seluruh data monitoringnya?')) return;
  m.subProgram = m.subProgram.filter(p=>p.id!==spId);
  if(activeSubProgramId===spId) activeSubProgramId = m.subProgram[0].id;
  persistMitra(m);
  renderAll();
}

/* ---------------------------- STAGE RAIL (MAIN) ------------------------ */
function renderStageRail(){
  const rail = document.getElementById('stageRail');
  const m = currentMitra();
  const sp = currentSubProgram();
  if(!m || !sp){ rail.innerHTML=''; return; }
  rail.innerHTML = TABS.map((s,i)=>{
    const st = stageStatusForSubProgram(sp,s.key);
    return `
      <div class="stage-node ${activeStage===s.key?'active':''}" onclick="setStage('${s.key}')">
        <span class="num">0${i+1}</span>
        <span class="label">${s.label}<span class="dot ${st}"></span></span>
      </div>`;
  }).join('');
}
function setStage(key){ activeStage=key; renderContent(); renderStageRail(); }

/* ------------------------------ CONTENT -------------------------------- */
function renderContent(){
  const m = currentMitra();
  const c = document.getElementById('content');
  if(!m){ renderOverviewContent(); return; }
  const sp = currentSubProgram();
  if(!sp){ c.innerHTML = `<div class="empty-state"><span class="glyph">🗂️</span>Belum ada sub program. Tambahkan lewat tombol "+ Sub Program" di atas.</div>`; return; }
  if(activeStage==='dana') return renderDana(m,sp,c);
  if(activeStage==='aktivitas') return renderAktivitas(m,sp,c);
  if(activeStage==='laporan') return renderLaporan(m,sp,c);
  if(activeStage==='evaluasi') return renderEvaluasi(m,sp,c);
}

/* --- DANA --- */
function renderDana(m,sp,c){
  const totalRapb = sp.dana.reduce((a,b)=>a+b.rapb,0);
  const totalRealisasi = sp.dana.reduce((a,b)=>a+b.realisasi,0);
  const totalSaldo = sp.dana.length? sp.dana[sp.dana.length-1].saldo : 0;
  const pct = totalRapb? Math.round(totalRealisasi/totalRapb*100):0;
  c.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total RAPB</div><div class="value plain">${fmtRp(totalRapb)}</div></div>
      <div class="stat-card"><div class="label">Total Realisasi</div><div class="value plain">${fmtRp(totalRealisasi)}</div><div class="sub">${pct}% dari RAPB</div></div>
      <div class="stat-card"><div class="label">Saldo Bulan Terakhir</div><div class="value plain">${fmtRp(totalSaldo)}</div></div>
      <div class="stat-card"><div class="label">Bulan Tercatat</div><div class="value">${sp.dana.length}</div><div class="sub">Frekuensi bulanan</div></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h3>Monitoring Dana Bulanan — ${sp.nama}</h3><p>RAPB, pencairan, realisasi, dan saldo per bulan.</p></div>
        <button class="btn btn-primary btn-sm" onclick="openDanaModal('${m.id}','${sp.id}')">+ Tambah Bulan</button>
      </div>
      <table>
        <thead><tr><th>Bulan</th><th class="num-cell">RAPB</th><th class="num-cell">Pencairan</th><th class="num-cell">Realisasi</th><th class="num-cell">Saldo</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${sp.dana.map((d,i)=>{
          const rasio = d.pencairan? d.realisasi/d.pencairan:0;
          const st = d.pencairan===0?'crit':(rasio>=0.7?'ok':rasio>=0.3?'warn':'crit');
          return `<tr>
            <td>${d.bulan}</td>
            <td class="num-cell num-plain">${fmtRp(d.rapb)}</td>
            <td class="num-cell num-plain">${fmtRp(d.pencairan)}</td>
            <td class="num-cell num-plain">${fmtRp(d.realisasi)}</td>
            <td class="num-cell num-plain">${fmtRp(d.saldo)}</td>
            <td><span class="chip ${statusChipClass[st]}">${Math.round(rasio*100)}%</span></td>
            <td class="row-actions"><button class="icon-btn" onclick="hapusDana('${m.id}','${sp.id}',${i})">✕</button></td>
          </tr>`;
        }).join('') || `<tr><td colspan="7"><div class="empty-state">Belum ada data dana bulanan.</div></td></tr>`}
        </tbody>
      </table>
    </div>`;
}

      <div class="stat-card"><div class="label">Kritis</div><div class="value" style="color:var(--crit)">${kritis}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h3>Seluruh Mitra</h3><p>Klik salah satu mitra untuk melihat detail monitoring.</p></div></div>
      <div class="overview-grid">
        ${mitraList.map(m=>{
          const os = overallStatus(m);
          return `<div class="overview-card" onclick="selectMitra('${m.id}')">
            <div class="overview-card-top">
              ${logoImg(m,'overview-logo')}
              <div>
                <h4>${m.nama}</h4>
                <div class="pic">PIC: ${m.pic} · ${m.subProgram.length} sub program</div>
              </div>
            </div>
            ${m.ringkasan?`<div class="ringkasan-snip">${m.ringkasan}</div>`:''}
            <span class="status-pill ${statusPillClass[os]}">${statusLabel[os]}</span>
            <div class="stage-rail-mini" style="margin-top:12px;">
              ${ALL_STAGES.map(s=>{const st=stageStatusForMitra(m,s.key); return `<span class="on ${st==='ok'?'':st}" style="background:${st==='ok'?'#2E8B57':st==='warn'?'#C7862B':'#C0473F'}"></span>`;}).join('')}
            </div>
          </div>`;
        }).join('') || `<div class="empty-state">Belum ada mitra. Klik "Tambah Mitra" untuk memulai.</div>`}
      </div>
    </div>`;
}

/* --------------------------------- MODAL -------------------------------- */
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

function openMitraModal(){
  openModal(`
    <h3>Tambah Mitra Baru</h3>
    <div class="field"><label>Nama Mitra</label><input id="f_nama" placeholder="Contoh: Yayasan ..."></div>
    <div class="field"><label>Nama Direktur</label><input id="f_direktur" placeholder="Nama direktur / pimpinan mitra"></div>
    <div class="field"><label>Nama PIC</label><input id="f_pic" placeholder="Nama penanggung jawab harian"></div>
    <div class="field"><label>Alamat Kantor Mitra</label><input id="f_alamat" placeholder="Alamat lengkap kantor"></div>
    <div class="field"><label>Kontak</label><input id="f_kontak" placeholder="No. HP / email"></div>
    <div class="field"><label>Tanggal Mulai Kemitraan</label><input id="f_mulai" type="date"></div>
    <div class="field"><label>Ringkasan Program</label><textarea id="f_ringkasan" placeholder="Ringkasan singkat program/kegiatan mitra, akan ditampilkan di halaman utama"></textarea></div>
    <div class="field"><label>Link Logo Mitra</label><input id="f_logo" placeholder="https://drive.google.com/... (tautan gambar logo)"></div>
    <div class="tag-note">Logo ditampilkan sebagai thumbnail. Sub program, dokumen legalitas, dana, aktivitas, laporan, dan evaluasi dapat dilengkapi setelah mitra dibuat.</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="simpanMitra()">Simpan</button></div>
  `);
}
function simpanMitra(){
  const nama = document.getElementById('f_nama').value.trim();
  if(!nama) return;
  const id = newMitraId();
  const m = {
    id, nama,
    direktur: document.getElementById('f_direktur').value||'—',
    pic: document.getElementById('f_pic').value||'—',
    alamat: document.getElementById('f_alamat').value||'—',
    kontak: document.getElementById('f_kontak').value||'—',
    mulai: document.getElementById('f_mulai').value||new Date().toISOString().slice(0,10),
    ringkasan: document.getElementById('f_ringkasan').value||'',
    logo: document.getElementById('f_logo').value||'',
    legalitas:[
      {nama:'Company Profile', status:'belum', link:'', tanggal:''},
      {nama:'Proposal Kegiatan', status:'belum', link:'', tanggal:''},
      {nama:'MoU', status:'belum', link:'', tanggal:''},
      {nama:'Pakta Integritas', status:'belum', link:'', tanggal:''},
    ],
    subProgram:[defaultSubProgram('Program Utama')]
  };
  mitraList.push(m);
  selectedMitraId = id;
  activeSubProgramId = m.subProgram[0].id;
  activeStage = 'dana';
  persistMitra(m);
  closeModal(); renderAll();
}
function hapusMitra(id){
  if(!confirm('Hapus mitra ini beserta seluruh data monitoringnya?')) return;
  mitraList = mitraList.filter(m=>m.id!==id);
  selectedMitraId = null;
  removeMitraRemote(id);
  renderAll();
}

/* --- EDIT INFORMASI MITRA --- */
function openEditMitraModal(mid){
  const m = mitraList.find(x=>x.id===mid);
  openModal(`
    <h3>Edit Informasi Mitra</h3>
    <div class="field"><label>Nama Mitra</label><input id="f_enama" value="${escAttr(m.nama)}"></div>
    <div class="field"><label>Nama Direktur</label><input id="f_edirektur" value="${escAttr(m.direktur)}"></div>
    <div class="field"><label>Nama PIC</label><input id="f_epic" value="${escAttr(m.pic)}"></div>
    <div class="field"><label>Alamat Kantor Mitra</label><input id="f_ealamat" value="${escAttr(m.alamat)}"></div>
    <div class="field"><label>Kontak</label><input id="f_ekontak" value="${escAttr(m.kontak)}"></div>
    <div class="field"><label>Tanggal Mulai Kemitraan</label><input id="f_emulai" type="date" value="${escAttr(m.mulai)}"></div>
    <div class="field"><label>Ringkasan Program</label><textarea id="f_eringkasan">${escHtml(m.ringkasan)}</textarea></div>
    <div class="field"><label>Link Logo Mitra</label><input id="f_elogo" value="${escAttr(m.logo)}"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="simpanEditMitra('${mid}')">Simpan Perubahan</button></div>
  `);
}
function simpanEditMitra(mid){
  const m = mitraList.find(x=>x.id===mid);
  const nama = document.getElementById('f_enama').value.trim();
  if(!nama) return;
  m.nama = nama;
  m.direktur = document.getElementById('f_edirektur').value||'—';
  m.pic = document.getElementById('f_epic').value||'—';
  m.alamat = document.getElementById('f_ealamat').value||'—';
  m.kontak = document.getElementById('f_ekontak').value||'—';
  m.mulai = document.getElementById('f_emulai').value||m.mulai;
  m.ringkasan = document.getElementById('f_eringkasan').value||'';
  m.logo = document.getElementById('f_elogo').value||'';
  persistMitra(m);
  closeModal(); renderAll();
}

/* --------------------------------- INIT --------------------------------- */
function renderAll(){
  renderSidebar();
  renderTopbar();
  if(selectedMitraId){
    renderProgramTabs();
    renderStageRail();
    renderContent();
  } else {
    document.getElementById('programTabs').innerHTML = '';
    document.getElementById('stageRail').innerHTML = '';
    renderOverviewContent();
  }
}
renderAll();
</script>
</body>
</html>
