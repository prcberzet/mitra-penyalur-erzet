<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<!--
  Skrip pendamping 404.html (trik spa-github-pages): 404.html menitipkan path
  asli lewat query string (format "?/path") lalu redirect ke sini. Skrip ini
  membaca titipan itu dan mengembalikan URL asli ke address bar via
  history.replaceState — TANPA reload — sebelum kode routing di bawah (lihat
  applyRouteFromUrl()) membaca location.pathname. Harus dieksekusi paling awal,
  makanya diletakkan sebagai baris pertama di <head>.
-->
<script>
  (function(l){
    if(l.search[1]==='/'){
      var decoded = l.search.slice(1).split('&').map(function(s){
        return s.replace(/~and~/g,'&');
      }).join('?');
      window.history.replaceState(null, null, l.pathname.slice(0,-1)+decoded+l.hash);
    }
  }(window.location));
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menara Kemitraan — Monitoring Mitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141B2E;
    --navy-2:#1F2A44;
    --navy-3:#2B3A5E;
    --bg:#F2F4F7;
    --surface:#FFFFFF;
    --ink:#171B26;
    --ink-soft:#626B7E;
    --ink-faint:#95A0B4;
    --line:#E2E5EC;
    --brand:#3A6B5C;
    --brand-soft:#E7F0EC;
    --ok:#2E8B57;
    --ok-soft:#E6F4EC;
    --warn:#C7862B;
    --warn-soft:#FBF0E1;
    --crit:#C0473F;
    --crit-soft:#FBEAE9;
    --radius:10px;
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#C7CDD9; border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:300px;
    min-width:300px;
    background:var(--navy);
    color:#EDEFF4;
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
    transition:opacity .15s;
  }
  .brand:hover{opacity:.85;}
  .brand-mark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    letter-spacing:0.2px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand-mark .dot{
    width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg,#5FBF9A,var(--brand));
    box-shadow:0 0 0 3px rgba(95,191,154,0.18);
  }
  .brand-sub{
    font-size:11.5px;
    color:#8D96AC;
    margin-top:4px;
    letter-spacing:0.3px;
  }
  .sidebar-tools{
    padding:14px 16px 8px;
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;
    padding:8px 10px;
  }
  .search-box input{
    background:transparent; border:none; outline:none;
    color:#EDEFF4; font-size:13px; width:100%;
  }
  .search-box input::placeholder{color:#7B8399;}
  .btn-add-mitra{
    margin-top:10px;
    width:100%;
    background:var(--brand);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:9px 12px;
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:background .15s;
  }
  .btn-add-mitra:hover{background:#2F5A4D;}

  #mitraList{
    flex:1;
    overflow-y:auto;
    padding:6px 10px 14px;
  }
  .mitra-card{
    padding:12px 12px;
    border-radius:9px;
    margin-bottom:6px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .12s;
  }
  .mitra-card:hover{background:rgba(255,255,255,0.05);}
  .mitra-card.active{
    background:var(--navy-2);
    border-color:rgba(255,255,255,0.1);
  }
  .mitra-card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  }
  .mitra-card-top-left{display:flex; gap:9px; align-items:flex-start; min-width:0;}
  .mitra-logo-sm{
    width:28px; height:28px; border-radius:7px; object-fit:cover;
    border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); flex-shrink:0;
  }
  .mitra-name{
    font-size:13.5px; font-weight:600; line-height:1.3;
    color:#F2F4F8;
  }
  .mitra-pic{
    font-size:11px; color:#8D96AC; margin-top:2px;
  }
  .status-pill{
    font-size:10px; font-weight:600; padding:2px 8px; border-radius:20px;
    white-space:nowrap; letter-spacing:.2px;
  }
  .pill-ok{background:var(--ok-soft); color:var(--ok);}
  .pill-warn{background:var(--warn-soft); color:var(--warn);}
  .pill-crit{background:var(--crit-soft); color:var(--crit);}

  .stage-rail-mini{
    display:flex; gap:4px; margin-top:9px;
  }
  .stage-rail-mini span{
    height:4px; flex:1; border-radius:3px; background:rgba(255,255,255,0.12);
  }
  .stage-rail-mini span.on{background:var(--brand);}
  .stage-rail-mini span.on.warn{background:var(--warn);}
  .stage-rail-mini span.on.crit{background:var(--crit);}

  .sidebar-foot{
    padding:12px 20px 16px;
    border-top:1px solid rgba(255,255,255,0.08);
    font-size:11px;
    color:#6E7690;
    display:flex; justify-content:space-between; align-items:center;
  }
  .conn-status{display:flex; align-items:center; gap:6px;}
  .conn-dot{width:7px;height:7px;border-radius:50%; background:#6E7690; flex-shrink:0;}
  .conn-dot.live{background:#5FBF9A;}
  .conn-dot.demo{background:#C7862B;}

  /* ---------- Main ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  #topbar{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:18px 32px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
  }
  #topbar h1{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:600;
  }
  #topbar .meta{
    font-size:12.5px; color:var(--ink-soft); margin-top:4px;
    display:flex; gap:14px; flex-wrap:wrap;
  }
  #topbar .meta span{display:flex; align-items:center; gap:5px;}
  .topbar-main{display:flex; gap:14px; align-items:flex-start;}
  .mitra-logo{
    width:52px; height:52px; border-radius:10px; object-fit:cover;
    border:1px solid var(--line); background:var(--bg); flex-shrink:0;
  }
  .ringkasan-text{
    font-size:12.5px; color:var(--ink-soft); margin-top:9px;
    max-width:640px; line-height:1.55;
  }
  .topbar-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .btn{
    border:1px solid var(--line);
    background:var(--surface);
    padding:8px 14px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    transition:all .12s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--brand); color:var(--brand);}
  .btn-primary{background:var(--brand); color:#fff; border-color:var(--brand);}
  .btn-primary:hover{background:#2F5A4D; color:#fff;}
  .btn-danger-ghost{color:var(--crit); border-color:var(--crit-soft);}
  .btn-danger-ghost:hover{background:var(--crit-soft); border-color:var(--crit);}
  .btn-sm{padding:5px 10px; font-size:11.5px;}

  .status-dot{
    width:7px; height:7px; border-radius:50%;
    display:inline-block; margin-left:7px; position:relative; top:-1px;
    background:var(--ink-faint);
  }
  .status-dot.ok{background:var(--ok);}
  .status-dot.warn{background:var(--warn);}
  .status-dot.crit{background:var(--crit);}

  /* Sub program tabs */
  #programTabs{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:10px 32px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .program-tab{
    display:flex; align-items:center; gap:7px;
    background:var(--bg); border:1px solid var(--line); border-radius:20px;
    padding:6px 10px 6px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .program-tab.active{background:var(--brand-soft); border-color:var(--brand); color:var(--brand);}
  .program-tab-del{
    font-size:10px; color:var(--ink-faint); border-radius:50%; width:16px; height:16px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .program-tab-del:hover{background:var(--crit-soft); color:var(--crit);}
  .program-tab-add{
    border:1px dashed var(--line); background:transparent; border-radius:20px;
    padding:6px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .program-tab-add:hover{border-color:var(--brand); color:var(--brand);}

  /* Stage rail (main) */
  #stageRail{
    display:flex;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:0 32px;
  }
  .stage-node{
    flex:1;
    padding:14px 6px 12px;
    text-align:center;
    border-bottom:3px solid transparent;
    cursor:pointer;
    position:relative;
    color:var(--ink-soft);
  }
  .stage-node.active{color:var(--ink); border-bottom-color:var(--brand);}
  .stage-node .num{
    font-family:var(--font-mono);
    font-size:11px;
    display:block;
    color:var(--ink-faint);
    margin-bottom:3px;
  }
  .stage-node .label{font-size:13px; font-weight:600;}
  .stage-node .dot{
    width:7px; height:7px; border-radius:50%;
    display:inline-block; margin-left:6px;
    background:var(--ink-faint);
    position:relative; top:-1px;
  }
  .stage-node .dot.ok{background:var(--ok);}
  .stage-node .dot.warn{background:var(--warn);}
  .stage-node .dot.crit{background:var(--crit);}

  #content{
    flex:1;
    overflow-y:auto;
    padding:26px 32px 60px;
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:20px;
  }
  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px;
  }
  .panel-head h3{
    font-family:var(--font-display);
    font-size:15px; font-weight:600;
  }
  .panel-head p{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase;
    letter-spacing:.4px; color:var(--ink-soft); font-weight:600;
    padding:8px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:10px 10px; border-bottom:1px solid var(--line);
    color:var(--ink);
  }
  tbody tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .num-plain{font-family:var(--font-body); font-variant-numeric:tabular-nums;}
  .num-cell{text-align:right;}

  .chip{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
    display:inline-flex; align-items:center; gap:5px;
  }
  .chip-ok{background:var(--ok-soft); color:var(--ok);}
  .chip-warn{background:var(--warn-soft); color:var(--warn);}
  .chip-crit{background:var(--crit-soft); color:var(--crit);}
  .chip::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}

  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{
    border:none; background:transparent; color:var(--ink-faint);
    padding:4px 6px; border-radius:6px; font-size:12px;
  }
  .icon-btn:hover{background:var(--bg); color:var(--ink);}

  .empty-state{
    text-align:center; padding:34px 20px; color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:26px; margin-bottom:8px; display:block;}

  .link-cell a{color:var(--brand); font-size:12.5px; text-decoration:none;}
  .link-cell a:hover{text-decoration:underline;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .label{font-size:11.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.3px;}
  .stat-card .value{font-family:var(--font-mono); font-size:24px; font-weight:600; margin-top:6px;}
  .stat-card .value.plain{font-family:var(--font-body);}
  .stat-card .sub{font-size:11.5px; color:var(--ink-faint); margin-top:3px;}

  .legalitas-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .legalitas-item:last-child{border-bottom:none;}
  .legalitas-left{display:flex; flex-direction:column; gap:3px;}
  .legalitas-left .name{font-size:13.5px; font-weight:600;}
  .legalitas-left .date{font-size:11.5px; color:var(--ink-faint);}
  select.status-select{
    border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12px;
    font-family:inherit; background:var(--surface); color:var(--ink);
  }

  /* Kartu Raport Kinerja: rincian aspek hanya tampil saat hover judul, atau permanen kalau di-klik (pinned) */
  .raport-card{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .raport-card:last-child{border-bottom:none;}
  .raport-title{flex:1; min-width:220px; cursor:pointer; display:flex; flex-direction:column; gap:3px;}
  .raport-title .name{font-size:13.5px; font-weight:600;}
  .raport-title .date{font-size:11.5px; color:var(--ink-faint);}
  .raport-caret{display:inline-block; margin-left:6px; font-size:10px; color:var(--ink-soft); transition:transform .25s ease;}
  .raport-title:hover .raport-caret{transform:rotate(90deg);}
  .raport-card.pinned .raport-title .raport-caret{transform:rotate(90deg);}
  .raport-actions{display:flex; gap:6px; flex-shrink:0;}
  .raport-aspek{
    flex-basis:100%; max-height:0; overflow:hidden;
    transition:max-height .35s ease, margin-top .35s ease; margin-top:0;
  }
  .raport-title:hover ~ .raport-aspek{ max-height:1000px; margin-top:10px; }
  .raport-card.pinned .raport-aspek{ max-height:1000px; margin-top:10px; }

  /* Overview grid of all mitra */
  .overview-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .overview-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; cursor:pointer; transition:border-color .12s, transform .12s;
  }
  .overview-card:hover{border-color:var(--brand); transform:translateY(-1px);}
  .overview-card-top{display:flex; gap:10px; align-items:flex-start; margin-bottom:10px;}
  .overview-logo{
    width:38px; height:38px; border-radius:8px; object-fit:cover;
    border:1px solid var(--line); background:var(--bg); flex-shrink:0;
  }
  .overview-card h4{font-size:14px; font-weight:600; margin-bottom:2px;}
  .overview-card .pic{font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
  .overview-card .ringkasan-snip{
    font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,27,46,0.45);
    display:none; align-items:center; justify-content:center; z-index:50;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface); border-radius:12px; width:100%; max-width:460px;
    max-height:88vh; overflow-y:auto; padding:24px;
  }
  .modal.modal-wide{ max-width:900px; }
  .modal h3{font-family:var(--font-display); font-size:16px; margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px;
    font-size:13px; font-family:inherit; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:64px;}

  /* ---------- Login ---------- */
  #loginOverlay{
    position:fixed; inset:0; z-index:200;
    background:var(--navy);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .login-box{
    width:100%; max-width:340px;
    background:var(--surface);
    border-radius:var(--radius);
    padding:28px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .login-box .brand-mark{color:var(--ink); margin-bottom:14px;}
  .login-box h2{font-family:var(--font-display); font-size:18px; margin-bottom:4px;}
  .login-box .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:20px; line-height:1.5;}
  .login-error{font-size:12px; color:var(--crit); margin:-6px 0 12px; min-height:14px;}
  .login-box .btn-primary{width:100%; padding:10px; font-size:13px; margin-top:4px;}
  .logout-link{background:transparent; border:none; color:#8D96AC; font-size:11px; text-decoration:underline; padding:0;}
  .logout-link:hover{color:#EDEFF4;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  .tag-note{
    font-size:11.5px; color:var(--ink-faint); background:var(--bg);
    border-radius:7px; padding:8px 10px; margin-top:12px; line-height:1.5;
  }

  @media (max-width:900px){
    #sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s;}
    #sidebar.open{transform:translateX(0);}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <div class="brand-mark"><span class="dot"></span>Menara Kemitraan</div>
    <h2>Masuk ke Dashboard</h2>
    <div class="sub">Silahkan login menggunakan email dan password</div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Masuk</button>
    </form>
  </div>
</div>

<aside id="sidebar">
  <div class="brand" onclick="renderOverview()" title="Kembali ke Ringkasan Semua Mitra">
    <div class="brand-mark"><span class="dot"></span>Menara Kemitraan</div>
    <div class="brand-sub">Monitoring Mitra Program</div>
  </div>
  <div class="sidebar-tools">
    <div class="search-box">
      <span>🔎</span>
      <input id="searchInput" placeholder="Cari mitra..." oninput="renderSidebar()">
    </div>
    <button class="btn-add-mitra" onclick="openMitraModal()">+ Tambah Mitra</button>
  </div>
  <div id="mitraList"></div>
  <div class="sidebar-foot">
    <span id="mitraCountFoot">0 mitra</span>
    <span style="display:flex; align-items:center; gap:10px;">
      <span class="conn-status" id="connStatus"><span class="conn-dot" id="connDot"></span><span id="connLabel">Memuat...</span></span>
      <button id="logoutBtn" class="logout-link" type="button" title="Keluar dari akun">Keluar</button>
    </span>
  </div>
</aside>

<main id="main">
  <div id="topbar"></div>
  <div id="programTabs"></div>
  <div id="stageRail"></div>
  <div id="content"></div>
</main>

<!-- Generic Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<!-- =========================================================================
     FIREBASE BOOTSTRAP (realtime, lintas perangkat)
     Isi firebaseConfig di bawah dengan konfigurasi project Firebase Anda
     sendiri (Firebase Console → Project Settings → Web App). Selama nilai
     apiKey masih diawali "GANTI_", aplikasi otomatis berjalan dalam
     "Mode Demo (lokal)" — tetap bisa dicoba penuh, hanya saja data tidak
     tersimpan permanen / tidak sinkron ke perangkat lain.

<script type="module">

    if(code==='auth/invalid-email') return 'Format email tidak valid.';

    if(code==='auth/network-request-failed') return 'Gagal terhubung ke server, cek koneksi internet.';
    return 'Gagal login. Coba lagi.';
  }

    const fb = window.__fb;

      window.__fbUser = user;
      window.dispatchEvent(new Event('auth-changed'));
    });
  })();
</script>

/* ---------------------------- URL ROUTING -------------------------------
   Skema: {basePath}/{slug-nama-mitra}/{slug-nama-subprogram}/{stage}
   Contoh: /mitra-penyalur-erzet/cita-sehat-foundation/klinik-sehat/evaluasi
   - PATH_SEGMENTS_TO_KEEP HARUS sama dengan variabel sejenis di 404.html,
     supaya basePath (nama repo di GitHub Pages) dihitung konsisten oleh
     keduanya. Untuk custom domain / root domain, ubah jadi 0 di kedua file.
   - Saat berpindah mitra/sub program/tahap, syncUrl() dipanggil (lewat
     renderAll(), setSubProgram(), setStage()) agar address bar selalu
     mencerminkan state saat ini (pakai history.pushState, tanpa reload).
   - Saat membuka link langsung / refresh / tombol back-forward browser,
     applyRouteFromUrl() membaca location.pathname dan mencocokkan slug ke
     data mitra yang ada untuk memulihkan state.
   ------------------------------------------------------------------------- */
const PATH_SEGMENTS_TO_KEEP = 1; // WAJIB sinkron dengan angka yang sama di 404.html
function slugify(str){
  return String(str||'')
    .toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
}
/* Fallback singkatan mitra (dipakai di No. Formulir Raport) kalau field Singkatan Mitra belum diisi manual:
   ambil huruf awal tiap kata bermakna (skip kata umum seperti "Yayasan", "dan", "untuk"). */
function autoSingkatan(nama){
  const skip = ['yayasan','komunitas','lembaga','perkumpulan','forum','dan','untuk','bagi','di','ke','dari'];
  const words = String(nama||'').split(/\s+/).filter(w=>w && !skip.includes(w.toLowerCase()));
  return words.map(w=>w[0].toUpperCase()).join('') || 'MTR';
}
function computeBasePath(){
  const segs = location.pathname.split('/');
  return segs.slice(0, 1+PATH_SEGMENTS_TO_KEEP).join('/');
}
function currentRouteParts(){
  const base = computeBasePath();
  let rest = location.pathname.slice(base.length).replace(/^\/+|\/+$/g,'');
  return rest ? rest.split('/') : [];
}
function buildRoutePath(){
  const base = computeBasePath();
  const m = currentMitra();
  if(!m) return base + '/';
  const sp = currentSubProgram();
  let path = base + '/' + slugify(m.nama);
  if(sp) path += '/' + slugify(sp.nama) + '/' + activeStage;
  return path;
}
function syncUrl(){
  const path = buildRoutePath();
  if(location.pathname !== path){
    history.pushState(null, '', path + location.hash);
  }
}
function applyRouteFromUrl(){
  const parts = currentRouteParts();
  if(!parts.length){
    selectedMitraId = null;
    renderAll();
    return;
  }
  const m = mitraList.find(x=>slugify(x.nama)===parts[0]);
  if(!m){
    selectedMitraId = null;
    renderAll();
    return;
  }
  selectedMitraId = m.id;
  const sp = parts[1] ? m.subProgram.find(p=>slugify(p.nama)===parts[1]) : null;
  activeSubProgramId = sp ? sp.id : (m.subProgram[0] ? m.subProgram[0].id : null);
  activeStage = (parts[2] && TABS.some(t=>t.key===parts[2])) ? parts[2] : 'dana';
  renderAll();
}
window.addEventListener('popstate', applyRouteFromUrl);

function normalizeMitra(m){
  m.legalitas = m.legalitas || [];
  m.singkatan = m.singkatan || autoSingkatan(m.nama);
  m.subProgram = (m.subProgram && m.subProgram.length) ? m.subProgram : [defaultSubProgram()];
  m.subProgram.forEach(sp=>{
    sp.dana = sp.dana || [];
    sp.aktivitasHarian = sp.aktivitasHarian || [];
    sp.aktivitasMingguan = sp.aktivitasMingguan || [];
    sp.laporanBulanan = (sp.laporanBulanan || []).map(l=>{
      const wrapLink = v => (v && typeof v==='object') ? {link:v.link||''} : {link:''};
      return {
        bulan: l.bulan||'',
        zreportTanggalKirim: l.zreportTanggalKirim||'',

        tertulis: wrapLink(l.tertulis),

      };
    });
    sp.evaluasi = sp.evaluasi || {raport:[],jadwal:[],catatan:[]};
    sp.evaluasi.raport = (sp.evaluasi.raport||[]).map(r=>{
      if(r.kuartal) return r; // sudah format kuartal baru
      return {
        kuartal:'Q1', tahun:new Date().getFullYear(), adaProject:false,

      };
    });
  });
  return m;
}

window.addEventListener('fb-ready', () => {

/* ---------------------------- STATUS ENGINE ---------------------------- */
function statusPra(m){
  const total = m.legalitas.length || 1;
  const ada = m.legalitas.filter(d=>d.status==='ada').length;
  const proses = m.legalitas.filter(d=>d.status==='proses').length;
  if(ada===total) return 'ok';
  if(ada+proses>=total || ada>0) return 'warn';
  return 'crit';
}
function statusDana(sp){
  if(!sp.dana.length) return 'crit';
  const last = sp.dana[sp.dana.length-1];
  const totalPencairan = (last.pencairanZakat||0)+(last.pencairanInfak||0);
  const totalRealisasi = (last.realisasiZakat||0)+(last.realisasiInfak||0);
  if(totalPencairan===0) return 'crit';
  const rasio = totalRealisasi/totalPencairan;
  if(rasio>=0.7) return 'ok';
  if(rasio>=0.3) return 'warn';
  return 'crit';
}
function statusAktivitas(sp){
  const hasHarian = sp.aktivitasHarian.length>0;
  const mingguOk = sp.aktivitasMingguan.length>0 && sp.aktivitasMingguan[0].status==='ada';
  if(hasHarian && mingguOk) return 'ok';
  if(hasHarian || mingguOk) return 'warn';
  return 'crit';
}
function statusLaporan(sp){
  if(!sp.laporanBulanan.length) return 'crit';
  const last = sp.laporanBulanan[sp.laporanBulanan.length-1];
  const items = [last.penerima, last.keuangan, last.dokumentasi, last.tertulis, last.ppt];
  const done = items.filter(x=>x && x.link && String(x.link).trim()).length;
  if(done===5) return 'ok';
  if(done>=3) return 'warn';
  return 'crit';
}
function statusEvaluasi(sp){
  if(sp.evaluasi.raport.length>0) return 'ok';
  if(sp.evaluasi.jadwal.length>0) return 'warn';
  return 'crit';
}
function stageStatusForSubProgram(sp,key){
  if(key==='dana') return statusDana(sp);
  if(key==='aktivitas') return statusAktivitas(sp);
  if(key==='laporan') return statusLaporan(sp);
  if(key==='evaluasi') return statusEvaluasi(sp);
}
/* Status per tahap untuk 1 mitra = kondisi terburuk di antara seluruh sub program */
function stageStatusForMitra(m,key){
  if(key==='pra') return statusPra(m);
  if(!m.subProgram.length) return 'crit';
  const hasil = m.subProgram.map(sp=>stageStatusForSubProgram(sp,key));
  if(hasil.includes('crit')) return 'crit';
  if(hasil.includes('warn')) return 'warn';
  return 'ok';
}
function overallStatus(m){
  const all = ALL_STAGES.map(s=>stageStatusForMitra(m,s.key));
  if(all.includes('crit')) return 'crit';
  if(all.includes('warn')) return 'warn';
  return 'ok';
}

const statusPillClass = {ok:'pill-ok', warn:'pill-warn', crit:'pill-crit'};
const statusChipClass = {ok:'chip-ok', warn:'chip-warn', crit:'chip-crit'};

   otomatis diganti placeholder berisi inisial nama mitra. */
function logoFallback(nama){
  const initials = encodeURIComponent((nama||'M').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase());
  return `https://ui-avatars.com/api/?name=${initials}&background=3A6B5C&color=fff&bold=true&size=128`;
}
function logoImg(m,cls){
  const fallback = logoFallback(m.nama);
  const src = (m.logo && m.logo.trim()) ? m.logo.trim() : fallback;
  return `<img class="${cls}" src="${src}" alt="Logo ${m.nama}" onerror="this.onerror=null;this.src='${fallback}'">`;
}

/* ------------------------------ CONTENT -------------------------------- */
function renderContent(){
  const m = currentMitra();
  const c = document.getElementById('content');
  if(!m){ renderOverviewContent(); return; }
  const sp = currentSubProgram();
  if(!sp){ c.innerHTML = `<div class="empty-state"><span class="glyph">🗂️</span>Belum ada sub program. Tambahkan lewat tombol "+ Sub Program" di atas.</div>`; return; }

  if(activeStage==='aktivitas') return renderAktivitas(m,sp,c);
  if(activeStage==='laporan') return renderLaporan(m,sp,c);

/* --- DANA ---
   Setiap entri dana bulanan memisahkan 2 sumber: Zakat & Infak.
   Field yang diinput: rapbZakat/rapbInfak, pencairanZakat/pencairanInfak,
   realisasiZakat/realisasiInfak. Saldo per sumber & saldo total SELALU
   dihitung otomatis (pencairan - realisasi), tidak pernah diinput manual. */
function saldoDana(d){
  const saldoZakat = (d.pencairanZakat||0) - (d.realisasiZakat||0);
  const saldoInfak = (d.pencairanInfak||0) - (d.realisasiInfak||0);
  return { saldoZakat, saldoInfak, saldoTotal: saldoZakat + saldoInfak };
}
/* --- DANA ---
   Setiap entri dana bulanan memisahkan 2 sumber: Zakat & Infak.
   Field yang diinput: rapbZakat/rapbInfak, pencairanZakat/pencairanInfak,
   realisasiZakat/realisasiInfak. Saldo per sumber & saldo total SELALU
   dihitung otomatis (pencairan - realisasi), tidak pernah diinput manual. */
function saldoDana(d){
  const saldoZakat = (d.pencairanZakat||0) - (d.realisasiZakat||0);
  const saldoInfak = (d.pencairanInfak||0) - (d.realisasiInfak||0);
  return { saldoZakat, saldoInfak, saldoTotal: saldoZakat + saldoInfak };
}
/* Sel saldo: merah + tebal kalau nilainya minus */
function saldoTd(v){
  return `<td class="num-cell num-plain"${v<0?' style="color:var(--crit); font-weight:600;"':''}>${fmtRp(v)}</td>`;
}

  const totalRealisasi = sp.dana.reduce((a,b)=>a+(b.realisasiZakat||0)+(b.realisasiInfak||0),0);
  const totalSaldo = sp.dana.length? saldoDana(sp.dana[sp.dana.length-1]).saldoTotal : 0;
  const pct = totalRapb? Math.round(totalRealisasi/totalRapb*100):0;
  c.innerHTML = `
    <div class="stat-grid">

      <div class="stat-card"><div class="label">Saldo Bulan Terakhir</div><div class="value plain"${totalSaldo<0?' style="color:var(--crit)"':''}>${fmtRp(totalSaldo)}</div><div class="sub">Gabungan Zakat + Infak</div></div>

        ${sp.dana.map((d,i)=>`
          <tr>
            <td>${d.bulan}</td>
            <td class="num-cell num-plain">${fmtRp(d.rapbZakat)}</td>
            <td class="num-cell num-plain">${fmtRp(d.pencairanZakat)}</td>
            <td class="num-cell num-plain">${fmtRp(d.realisasiZakat)}</td>

            <td class="row-actions">

            </td>
          </tr>`).join('') || `<tr><td colspan="6"><div class="empty-state">Belum ada data dana Zakat.</div></td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h3>Dana Infak — ${sp.nama}</h3><p>RAPB, pencairan, realisasi, dan saldo bulanan sumber Infak.</p></div>

      </div>
      <table>
        <thead><tr><th>Bulan</th><th class="num-cell">RAPB</th><th class="num-cell">Pencairan</th><th class="num-cell">Realisasi</th><th class="num-cell">Saldo</th><th></th></tr></thead>
        <tbody>
        ${sp.dana.map((d,i)=>`
          <tr>

              <button class="icon-btn" onclick="openEditDanaModal('${m.id}','${sp.id}',${i})">✎</button>

            </td>
          </tr>`).join('') || `<tr><td colspan="6"><div class="empty-state">Belum ada data dana Infak.</div></td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h3>Ringkasan Saldo Total per Bulan</h3><p>Gabungan saldo Zakat + Infak, dan status penyerapan dana.</p></div>
      </div>

        <tbody>
        ${sp.dana.map((d)=>{

          const totalRealisasiRow = (d.realisasiZakat||0)+(d.realisasiInfak||0);
          const rasio = totalPencairan? totalRealisasiRow/totalPencairan : 0;
          const st = totalPencairan===0?'crit':(rasio>=0.7?'ok':rasio>=0.3?'warn':'crit');

        </tbody>
      </table>
    </div>`;
}
const BULAN_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function tahunRangeUmum(){
  const now = new Date().getFullYear();
  const arr = [];
  for(let y=now-2; y<=now+3; y++) arr.push(y);
  return arr;
}
function parseBulanTahun(str){
  const now = new Date();
  if(!str) return { bulanNama: BULAN_NAMES[now.getMonth()], tahun: now.getFullYear() };
  const idx = str.lastIndexOf(' ');
  if(idx<0) return { bulanNama: str, tahun: now.getFullYear() };
  return { bulanNama: str.slice(0,idx), tahun: str.slice(idx+1) };
}
function bulanTahunFieldHtml(prefix, bulanStr){
  const { bulanNama, tahun } = parseBulanTahun(bulanStr);
  const monthOpts = BULAN_NAMES.map(b=>`<option value="${b}" ${b===bulanNama?'selected':''}>${b}</option>`).join('');
  const yearOpts = tahunRangeUmum().map(y=>`<option value="${y}" ${String(y)===String(tahun)?'selected':''}>${y}</option>`).join('');
  return `
    <div style="display:flex; gap:10px;">
      <div class="field" style="flex:2;"><label>Bulan</label><select id="f_${prefix}bulanNama">${monthOpts}</select></div>
      <div class="field" style="flex:1;"><label>Tahun</label><select id="f_${prefix}bulanTahun">${yearOpts}</select></div>
    </div>`;
}
function danaFormFields(prefix, d){
  d = d || {};
  return `
    ${bulanTahunFieldHtml(prefix, d.bulan)}
    <div style="font-size:12px; font-weight:600; color:var(--brand); margin:2px 0 8px;">Sumber: Zakat</div>
    <div class="field"><label>RAPB Zakat</label><input id="f_${prefix}rapbz" type="number" placeholder="0" value="${d.rapbZakat??''}"></div>
    <div class="field"><label>Pencairan Zakat</label><input id="f_${prefix}pencz" type="number" placeholder="0" value="${d.pencairanZakat??''}"></div>
    <div class="field"><label>Realisasi Zakat</label><input id="f_${prefix}realz" type="number" placeholder="0" value="${d.realisasiZakat??''}"></div>
    <div style="font-size:12px; font-weight:600; color:var(--brand); margin:2px 0 8px;">Sumber: Infak</div>
    <div class="field"><label>RAPB Infak</label><input id="f_${prefix}rapbi" type="number" placeholder="0" value="${d.rapbInfak??''}"></div>
    <div class="field"><label>Pencairan Infak</label><input id="f_${prefix}penci" type="number" placeholder="0" value="${d.pencairanInfak??''}"></div>

    <div class="tag-note">Saldo Zakat, Saldo Infak, dan Saldo Total dihitung otomatis (Pencairan − Realisasi), tidak perlu diisi manual.</div>`;

/* Kesesuaian SLA Weekly Report: deadline tiap Selasa per pekan.
   Senin/Selasa = tepat waktu (100%), Rabu = 75%, Kamis-Minggu = 50%. */
function dayOfWeekFromTanggal(tanggal){
  const [y,mo,d] = tanggal.split('-').map(Number);
  return new Date(y, mo-1, d).getDay(); // 0=Min,1=Sen,2=Sel,3=Rab,4=Kam,5=Jum,6=Sab
}
function slaWeekly(tanggal){
  if(!tanggal) return { pct:null, label:'Belum Dikirim' };
  const day = dayOfWeekFromTanggal(tanggal);
  if(day===1 || day===2) return { pct:100, label:'Tepat Waktu' };
  if(day===3) return { pct:75, label:'Terlambat 1 Hari' };
  return { pct:50, label:'Terlambat' };
}
function slaBadge(tanggal){
  const { pct, label } = slaWeekly(tanggal);
  if(pct===null) return `<span class="chip" style="background:var(--bg); color:var(--ink-faint);">${label}</span>`;
  const cls = pct===100?'chip-ok':pct===75?'chip-warn':'chip-crit';
  return `<span class="chip ${cls}">${pct}% · ${label}</span>`;
}

/* Label minggu format: "Minggu ke-{pekan} {Bulan} {Tahun}" — pekan & bulan/tahun via dropdown */
function parseMingguLabel(str){
  const now = new Date();
  if(!str) return { pekan:1, bulanNama:BULAN_NAMES[now.getMonth()], tahun:now.getFullYear() };
  const mMatch = str.match(/ke-(\d+)/);
  const pekan = mMatch ? Number(mMatch[1]) : 1;
  const rest = str.replace(/^.*?ke-\d+\s*/,'').trim();
  const { bulanNama, tahun } = parseBulanTahun(rest);
  return { pekan, bulanNama, tahun };
}
function mingguFieldHtml(prefix, mingguStr){

  const monthOpts = BULAN_NAMES.map(b=>`<option value="${b}" ${b===bulanNama?'selected':''}>${b}</option>`).join('');
  const yearOpts = tahunRangeUmum().map(y=>`<option value="${y}" ${String(y)===String(tahun)?'selected':''}>${y}</option>`).join('');
  return `
    <div style="display:flex; gap:10px;">
      <div class="field" style="flex:1;"><label>Pekan</label><select id="f_${prefix}mpekan">${pekanOpts}</select></div>
      <div class="field" style="flex:2;"><label>Bulan</label><select id="f_${prefix}mbulan">${monthOpts}</select></div>

}

/* --- LAPORAN --- */
/* SLA Laporan Bulanan: dihitung dari selisih Tanggal Target vs Tanggal Diterima Lembaga.
   Tepat waktu (diterima <= target) = 100%. Terlambat 1 hari = 50%. Lebih dari 1 hari = 0%. */
function toUTCDays(str){
  const [y,mo,d] = str.split('-').map(Number);
  return Date.UTC(y,mo-1,d)/86400000;
}
function slaLaporan(target, diterima){
  if(!target || !diterima) return { pct:null, label:'Belum Diterima' };
  const diff = Math.round(toUTCDays(diterima) - toUTCDays(target));
  if(diff<=0) return { pct:100, label:'Tepat Waktu' };
  if(diff===1) return { pct:50, label:'Terlambat 1 Hari' };
  return { pct:0, label:'Terlambat >1 Hari' };
}
function slaLaporanBadge(target, diterima){
  const { pct, label } = slaLaporan(target, diterima);
  if(pct===null) return `<span class="chip" style="background:var(--bg); color:var(--ink-faint);">${label}</span>`;
  const cls = pct===100?'chip-ok':pct===50?'chip-warn':'chip-crit';
  return `<span class="chip ${cls}">${pct}% · ${label}</span>`;
}
/* SLA ZReport: target otomatis = tanggal akhir bulan laporan (bukan input manual).
   Tepat waktu = 100%, terlambat 1 hari = 50%, terlambat >1 hari = 0%. */
function endOfMonthStr(bulanStr){
  const { bulanNama, tahun } = parseBulanTahun(bulanStr);
  const idx = BULAN_NAMES.indexOf(bulanNama);
  if(idx<0 || !tahun) return '';
  const lastDay = new Date(Number(tahun), idx+1, 0).getDate();
  return `${tahun}-${String(idx+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
}
function slaZReport(l){
  const target = endOfMonthStr(l.bulan);
  if(!target || !l.zreportTanggalKirim) return { pct:null, label:'Belum Dikirim' };
  const diff = Math.round(toUTCDays(l.zreportTanggalKirim) - toUTCDays(target));
  if(diff<=0) return { pct:100, label:'Tepat Waktu' };
  if(diff===1) return { pct:50, label:'Terlambat 1 Hari' };
  return { pct:0, label:'Terlambat >1 Hari' };
}
function slaZReportBadge(l){
  const { pct, label } = slaZReport(l);
  if(pct===null) return `<span class="chip" style="background:var(--bg); color:var(--ink-faint);">ZReport: ${label}</span>`;
  const cls = pct===100?'chip-ok':pct===50?'chip-warn':'chip-crit';
  return `<span class="chip ${cls}">ZReport ${pct}% · ${label}</span>`;
}
function isKomponenLengkap(obj){ return !!(obj && obj.link && String(obj.link).trim()); }
function komponenCell(obj, extraHtml){
  const ok = isKomponenLengkap(obj);
  return `<td>
    <span class="chip ${ok?'chip-ok':'chip-crit'}">${ok?'Lengkap':'Belum'}</span>
    ${extraHtml||''}
    ${ok?`<div class="link-cell" style="margin-top:4px;"><a href="${obj.link}" target="_blank">Lihat ↗</a></div>`:''}
  </td>`;
}

/* ---------------------------- RAPORT KINERJA -----------------------------
   Raport diterbitkan per kuartal. Sebagian besar nilai aspek DIHITUNG OTOMATIS
   dari data tab lain (Dana, Laporan, Aktivitas) berdasarkan kuartal & tahun
   yang dipilih — tidak disimpan sebagai angka statis, supaya selalu
   mencerminkan data terkini. Yang disimpan ke record raport hanya input yang
   memang tidak punya sumber otomatis: kuartal/tahun, penanda "ada project",
   kesesuaian asnaf (manual), target penerima manfaat (manual), dan catatan.
   --------------------------------------------------------------------------- */
const QUARTALS = [
  {key:'Q1', label:'Kuartal 1 (Jan–Mar)', months:[0,1,2]},
  {key:'Q2', label:'Kuartal 2 (Apr–Jun)', months:[3,4,5]},
  {key:'Q3', label:'Kuartal 3 (Jul–Sep)', months:[6,7,8]},
  {key:'Q4', label:'Kuartal 4 (Okt–Des)', months:[9,10,11]},
];
function currentQuarterKey(){ return QUARTALS[Math.floor(new Date().getMonth()/3)].key; }
function quarterBulanList(kuartalKey, tahun){
  const q = QUARTALS.find(x=>x.key===kuartalKey) || QUARTALS[0];
  return q.months.map(mi=>`${BULAN_NAMES[mi]} ${tahun}`);
}
function danaInQuarter(sp,kuartal,tahun){ const list=quarterBulanList(kuartal,tahun); return sp.dana.filter(d=>list.includes(d.bulan)); }
function laporanInQuarter(sp,kuartal,tahun){ const list=quarterBulanList(kuartal,tahun); return sp.laporanBulanan.filter(l=>list.includes(l.bulan)); }
function harianInQuarter(sp,kuartal,tahun){
  const q = QUARTALS.find(x=>x.key===kuartal) || QUARTALS[0];
  return sp.aktivitasHarian.filter(a=>{
    if(!a.tanggal) return false;
    const [y,mo] = a.tanggal.split('-').map(Number);
    return y===Number(tahun) && q.months.includes(mo-1);
  });
}
function waktuPenerimaanPct(sp,kuartal,tahun){
  const entries = laporanInQuarter(sp,kuartal,tahun);
  if(!entries.length) return null;
  const total = entries.reduce((a,l)=>{ const s=slaLaporan(l.targetTanggal,l.diterimaTanggal); return a+(s.pct===null?0:s.pct); },0);
  return Math.round(total/entries.length);
}
function rilisBeritaPct(sp,kuartal,tahun){ return harianInQuarter(sp,kuartal,tahun).length ? 100 : 0; }
function zreportPct(sp,kuartal,tahun){
  const entries = laporanInQuarter(sp,kuartal,tahun);
  if(!entries.length) return null;
  const total = entries.reduce((a,l)=>{ const s=slaZReport(l); return a+(s.pct===null?0:s.pct); },0);
  return Math.round(total/entries.length);
}
function dssPct(sp,kuartal,tahun){
  const entries = danaInQuarter(sp,kuartal,tahun);
  const totalCair = entries.reduce((a,d)=>a+(d.pencairanZakat||0)+(d.pencairanInfak||0),0);
  const totalRealisasi = entries.reduce((a,d)=>a+(d.realisasiZakat||0)+(d.realisasiInfak||0),0);
  return totalCair? Math.round(totalRealisasi/totalCair*100) : 0;
}
function capaianPM(sp,kuartal,tahun){
  return laporanInQuarter(sp,kuartal,tahun).reduce((a,l)=>a+(l.penerima?.totalPP||0)+(l.penerima?.totalLM||0),0);
}
function asnafPct(v){ return v==='sesuai'?100:(v==='tidak'?0:null); }
function raportAspekList(sp, r){
  const waktu = waktuPenerimaanPct(sp,r.kuartal,r.tahun);
  const rilis = rilisBeritaPct(sp,r.kuartal,r.tahun);
  const zrep = zreportPct(sp,r.kuartal,r.tahun);
  const dss = dssPct(sp,r.kuartal,r.tahun);
  const capaian = capaianPM(sp,r.kuartal,r.tahun);
  const targetPM = Number(r.targetPM)||0;
  const pmPct = targetPM ? Math.round(capaian/targetPM*100) : null;
  const aspects = [];
  if(r.adaProject){
    const sub = [waktu, asnafPct(r.asnafProject), rilis].filter(v=>v!==null);
    aspects.push({nama:'Laporan Pelaksanaan Project', pct: sub.length?Math.round(sub.reduce((a,b)=>a+b,0)/sub.length):null,
      detail:[
        {label:'Waktu Penerimaan Laporan', pct:waktu},
        {label:'Kesesuaian Asnaf', pct:asnafPct(r.asnafProject), text: r.asnafProject==='sesuai'?'Sesuai':r.asnafProject==='tidak'?'Tidak Sesuai':'Belum diisi'},
        {label:'Rilis Berita & Dokumentasi', pct:rilis},
      ]});
  }
  {
    const sub = [waktu, asnafPct(r.asnafReguler), zrep, rilis].filter(v=>v!==null);
    aspects.push({nama:'Laporan Pelaksanaan Program Reguler', pct: sub.length?Math.round(sub.reduce((a,b)=>a+b,0)/sub.length):null,
      detail:[
        {label:'Waktu Penerimaan Laporan', pct:waktu},
        {label:'Kesesuaian Asnaf', pct:asnafPct(r.asnafReguler), text: r.asnafReguler==='sesuai'?'Sesuai':r.asnafReguler==='tidak'?'Tidak Sesuai':'Belum diisi'},
        {label:'ZReport', pct:zrep},
        {label:'Rilis Berita & Dokumentasi', pct:rilis},
      ]});
  }
  aspects.push({nama:'Penyerapan DSS', pct:dss, detail:[{label:'Realisasi ÷ Dana Cair', pct:dss}]});
  aspects.push({nama:'Pencapaian Target Penerima Manfaat', pct:pmPct, detail:[{label:`Capaian ${capaian} dari Target ${targetPM||'-'}`, pct:pmPct}]});
  aspects.push({nama:'Dampak Program', pct:null, detail:[{label:'Akan dikembangkan kemudian', pct:null}]});
  aspects.forEach((a,idx)=>{ a.no = idx+1; }); // nomor urut mengikuti aspek yang benar-benar tampil
  return aspects;
}
function raportOverallPct(sp,r){
  const scored = raportAspekList(sp,r).filter(a=>a.nama!=='Dampak Program').map(a=>a.pct).filter(v=>v!==null);
  return scored.length? Math.round(scored.reduce((a,b)=>a+b,0)/scored.length) : null;
}
function gradeFromPct(pct){
  if(pct===null) return '-';
  if(pct>=90) return 'A';
  if(pct>=80) return 'A-';
  if(pct>=70) return 'B+';
  if(pct>=60) return 'B';
  if(pct>=50) return 'C+';
  return 'C';
}
function pctBadge(pct){
  if(pct===null) return `<span class="chip" style="background:var(--bg); color:var(--ink-faint);">Belum tersedia</span>`;
  const cls = pct>=80?'chip-ok':pct>=50?'chip-warn':'chip-crit';
  return `<span class="chip ${cls}">${pct}%</span>`;
}

function renderEvaluasi(m,sp,c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Raport Kinerja — ${sp.nama}</h3><p>Penilaian berkala per kuartal terhadap kinerja sub program.</p></div>
        <button class="btn btn-primary btn-sm" onclick="openRaportModal('${m.id}','${sp.id}')">+ Terbitkan Raport</button>
      </div>
      ${sp.evaluasi.raport.map((r,i)=>{
        const aspects = raportAspekList(sp,r);
        const overall = raportOverallPct(sp,r);
        return `<div class="raport-card">
          <div class="raport-title" onclick="toggleRaportPin(this.closest('.raport-card'))">
            <div class="name">${QUARTALS.find(q=>q.key===r.kuartal)?.label || r.kuartal} ${r.tahun} — Nilai ${overall===null?'-':overall+'%'} (${gradeFromPct(overall)})<span class="raport-caret">▸</span></div>
            <div class="date">${r.catatan||''}</div>
          </div>
          <div class="raport-actions">
            <button class="icon-btn" title="Export Raport" onclick="event.stopPropagation(); exportRaport('${m.id}','${sp.id}',${i})">⬇</button>
            <button class="icon-btn" onclick="event.stopPropagation(); openEditRaportModal('${m.id}','${sp.id}',${i})">✎</button>
            <button class="icon-btn" onclick="event.stopPropagation(); hapusRaport('${m.id}','${sp.id}',${i})">✕</button>
          </div>
          <div class="raport-aspek">
          <table>
            <thead><tr><th>Aspek Penilaian</th><th class="num-cell">Nilai</th></tr></thead>
            <tbody>
            ${aspects.map(a=>`<tr>
              <td>${a.no}. ${a.nama}
                <div style="font-size:11px; color:var(--ink-soft); margin-top:2px;">${a.detail.map(d=>`${d.label}: ${d.pct===null?(d.text||'—'):d.pct+'%'}`).join(' · ')}</div>
              </td>
              <td class="num-cell">${pctBadge(a.pct)}</td>
            </tr>`).join('')}
            </tbody>
          </table>
          </div>
        </div>`;
      }).join('') || `<div class="empty-state"><span class="glyph">🏁</span>Belum ada raport kinerja diterbitkan.</div>`}
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h3>Jadwal Meeting Evaluasi</h3><p>Agenda pertemuan evaluasi dengan mitra.</p></div>
        <button class="btn btn-primary btn-sm" onclick="openJadwalModal('${m.id}','${sp.id}')">+ Tambah Jadwal</button>
      </div>
      <table>
        <thead><tr><th>Tanggal</th><th>Agenda</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${sp.evaluasi.jadwal.map((j,i)=>`
          <tr>

/* Export Raport Kinerja jadi file HTML mandiri yang bisa dibuka/dicetak/dibagikan. */
/* Export Raport Kinerja → file PDF resmi (Header: logo + judul + No. Formulir/Tahun/Periode;
   Identitas Dokumen: Mitra/Program/Sub Program; Tabel Aspek Penilaian; Nilai Akhir). */
function exportRaport(mid,spId,idx){
  const m = mitraList.find(x=>x.id===mid);
  const sp = m.subProgram.find(p=>p.id===spId);
  const r = sp.evaluasi.raport[idx];
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert('Modul pembuat PDF belum termuat (perlu koneksi internet untuk memuat jsPDF dari CDN). Coba lagi setelah halaman selesai dimuat penuh.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const marginL = 15, marginR = 15;
  const contentR = pageW - marginR;

  const aspects = raportAspekList(sp,r);
  const overall = raportOverallPct(sp,r);
  const grade = gradeFromPct(overall);
  const q = QUARTALS.find(x=>x.key===r.kuartal) || QUARTALS[0];
  const nomorUrut = idx + 1; // urutan penerbitan raport untuk sub program ini
  const noFormulir = `${nomorUrut}/PRCB/PKMP/${m.singkatan || autoSingkatan(m.nama)}`;
  const namaProgram = 'Mitra Penyalur'; // TODO: sesuaikan bila app menambah field "Program" tersendiri

  /* --- HEADER --- */
  // Kiri: logo Rumah Zakat (proporsi asli dijaga, tinggi maks 18mm)
  const logoW = 18, logoH = 18 * (238/300); // rasio asli ikon hasil crop
  doc.addImage(LOGO_RZ_BASE64, 'PNG', marginL, 12 + (20-logoH)/2, logoW, logoH);

  // Tengah: judul
  doc.setTextColor(20);
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.text('PENILAIAN KINERJA MITRA PENYALUR', pageW/2, 19, {align:'center'});
  doc.text('RUMAH ZAKAT', pageW/2, 25.5, {align:'center'});

  // Kanan: No. Formulir / Tahun / Periode
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text(`No. Formulir : ${noFormulir}`, contentR, 15, {align:'right'});
  doc.text(`Tahun : ${r.tahun}`, contentR, 20, {align:'right'});
  doc.text(`Periode : ${q.label}`, contentR, 25, {align:'right'});

  doc.setDrawColor(30); doc.setLineWidth(0.4);
  doc.line(marginL, 36, contentR, 36);

  /* --- IDENTITAS DOKUMEN --- */
  let y = 44;
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(20);
  doc.text('IDENTITAS DOKUMEN', marginL, y);
  y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text(`Mitra Penyalur : ${m.nama}`, marginL, y);
  y += 6;
  doc.text(`Program : ${namaProgram}`, marginL, y);
  doc.text(`Sub Program : ${sp.nama}`, marginL + 95, y);
  y += 10;

  /* --- TABEL ASPEK PENILAIAN --- */
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('TABEL ASPEK PENILAIAN', marginL, y);
  y += 4;

  const rows = aspects.map(a=>[
    String(a.no),
    a.nama,
    a.detail.map(d=>`${d.label}: ${d.pct===null?(d.text||'—'):d.pct+'%'}`).join('\n'),
    a.pct===null?'Belum tersedia':`${a.pct}%`,
  ]);
  doc.autoTable({
    startY: y,
    margin: { left: marginL, right: marginR },
    head: [['No','Aspek Penilaian','Rincian Perhitungan','Nilai']],
    body: rows,
    styles: { fontSize: 8.5, cellPadding: 2.5, valign:'top', lineColor:[200,200,200], lineWidth:0.15 },
    headStyles: { fillColor:[230,236,233], textColor:20, fontStyle:'bold' },
    columnStyles: { 0:{cellWidth:8, halign:'center'}, 1:{cellWidth:48}, 3:{cellWidth:22, halign:'center'} },
  });

  let finalY = doc.lastAutoTable.finalY + 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text(`Nilai Akhir Raport Kinerja : ${overall===null?'-':overall+'%'} (${grade})`, marginL, finalY);

  if(r.catatan){
    finalY += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    const catatanLines = doc.splitTextToSize(`Catatan: ${r.catatan}`, contentR-marginL);
    doc.text(catatanLines, marginL, finalY);
    finalY += catatanLines.length*5;
  }

  const pageH = doc.internal.pageSize.getHeight();
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140);
  doc.text(`Dokumen ini dibuat otomatis oleh Menara Kemitraan pada ${new Date().toLocaleString('id-ID')}.`, marginL, pageH-10);

  if(currentPreviewUrl){ URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl = null; }
  const blob = doc.output('blob');
  currentPreviewUrl = URL.createObjectURL(blob);
  const filename = `Raport-${slugify(m.nama)}-${slugify(sp.nama)}-${r.kuartal}-${r.tahun}.pdf`;
  openModalWide(`
    <h3>Pratinjau Raport Kinerja</h3>
    <iframe src="${currentPreviewUrl}" style="width:100%; height:70vh; border:1px solid var(--line); border-radius:8px; display:block;"></iframe>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn" onclick="closeModal()">Tutup</button>
      <button class="btn btn-primary" onclick="downloadPreviewPdf('${filename}')">⬇ Unduh PDF</button>
    </div>
  `);
}
function downloadPreviewPdf(filename){
  if(!currentPreviewUrl) return;
  const a = document.createElement('a');
  a.href = currentPreviewUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

}
function hapusMitra(id){
  if(!confirm('Hapus mitra ini beserta seluruh data monitoringnya?')) return;
  mitraList = mitraList.filter(m=>m.id!==id);
  selectedMitraId = null;
  removeMitraRemote(id);
  renderAll();
}

/* --- EDIT INFORMASI MITRA --- */
function openEditMitraModal(mid){
  const m = mitraList.find(x=>x.id===mid);
  openModal(`
    <h3>Edit Informasi Mitra</h3>
    <div class="field"><label>Nama Mitra</label><input id="f_enama" value="${escAttr(m.nama)}"></div>
    <div class="field"><label>Singkatan Mitra</label><input id="f_esingkatan" value="${escAttr(m.singkatan)}" placeholder="Contoh: CSF (dipakai di No. Formulir Raport Kinerja)"></div>
    <div class="field"><label>Nama Direktur</label><input id="f_edirektur" value="${escAttr(m.direktur)}"></div>
    <div class="field"><label>Nama PIC</label><input id="f_epic" value="${escAttr(m.pic)}"></div>
    <div class="field"><label>Alamat Kantor Mitra</label><input id="f_ealamat" value="${escAttr(m.alamat)}"></div>
    <div class="field"><label>Kontak</label><input id="f_ekontak" value="${escAttr(m.kontak)}"></div>
    <div class="field"><label>Tanggal Mulai Kemitraan</label><input id="f_emulai" type="date" value="${escAttr(m.mulai)}"></div>
    <div class="field"><label>Ringkasan Program</label><textarea id="f_eringkasan">${escHtml(m.ringkasan)}</textarea></div>
    <div class="field"><label>Link Logo Mitra</label><input id="f_elogo" value="${escAttr(m.logo)}"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="simpanEditMitra('${mid}')">Simpan Perubahan</button></div>
  `);
}
function simpanEditMitra(mid){
  const m = mitraList.find(x=>x.id===mid);
  const nama = document.getElementById('f_enama').value.trim();
  if(!nama) return;
  m.nama = nama;
  m.singkatan = document.getElementById('f_esingkatan').value||autoSingkatan(nama);
  m.direktur = document.getElementById('f_edirektur').value||'—';
  m.pic = document.getElementById('f_epic').value||'—';
  m.alamat = document.getElementById('f_ealamat').value||'—';
  m.kontak = document.getElementById('f_ekontak').value||'—';
  m.mulai = document.getElementById('f_emulai').value||m.mulai;
  m.ringkasan = document.getElementById('f_eringkasan').value||'';
  m.logo = document.getElementById('f_elogo').value||'';
  persistMitra(m);
  closeModal(); renderAll();
}

/* --------------------------------- INIT --------------------------------- */
function renderAll(){
  renderSidebar();
  renderTopbar();
  if(selectedMitraId){
    renderProgramTabs();
    renderStageRail();
    renderContent();
  } else {
    document.getElementById('programTabs').innerHTML = '';
    document.getElementById('stageRail').innerHTML = '';
    renderOverviewContent();
  }
  syncUrl();
}
applyRouteFromUrl();
</script>
</body>
</html>
