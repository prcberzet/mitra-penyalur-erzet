<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mitra Penyalur Erzet</title>
  <!--
    File ini WAJIB ada di root repo (sejajar dengan index.html) agar GitHub Pages
    tidak menampilkan halaman 404 saat seseorang membuka link dalam secara langsung
    atau me-refresh halaman, misalnya:
      https://prcberzet.github.io/mitra-penyalur-erzet/CSF/klinik/evaluasi

    GitHub Pages hanya melayani file statis, jadi path seperti itu tidak punya file
    fisik dan otomatis diarahkan ke sini. Skrip di bawah "menitipkan" path aslinya
    lewat query string lalu redirect ke index.html, yang kemudian membaca titipan
    itu (lihat skrip di <head> index.html) dan mengembalikan URL ke bentuk semula.
  -->
  <script>
    var pathSegmentsToKeep = 1; // jumlah segmen awal yang dipertahankan (nama repo project page)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  Mengalihkan…
</body>
</html>
